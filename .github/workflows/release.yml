name: Release

# Fully automatic releases, driven by the VERSION file in the repo root.
#
#   New version   Edit VERSION (e.g. 1.4 -> 1.5) and push to main.
#                 A new tag v1.5 + GitHub Release is created with auto-generated
#                 notes (same as "Generate release notes" in the UI) and the 4
#                 installer files attached.
#
#   Same version  Push changes to main without touching VERSION. If the
#                 committed installers differ from the ones on the release,
#                 they are replaced and the tag v1.5 is moved to the new commit.
#                 If they are identical, nothing happens.
#
# Assumes the 4 installer files are already rebuilt and committed (run the dev
# rig build locally first) - this workflow publishes what is in the repo.
# Run it by hand any time: Actions -> Release -> Run workflow.
# Logic lives in .github/scripts/release.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, for release notes and tag checks

      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh
